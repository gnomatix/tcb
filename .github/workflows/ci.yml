name: ci

# Compile + unit-test the Rust crate on the shipping target (Windows) and run the
# front-end smoke tests in headless Chromium. release.yml only runs on tags, so this
# is what gives every branch push a Windows build signal.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    name: cargo test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Unit tests (markdown rendering, text-format round trip, git/snapshot helpers).
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Make sure the binary target (main.rs + tauri_build context) still compiles too.
      - name: cargo build (debug)
        working-directory: src-tauri
        run: cargo build --locked

  # Full release-profile bundle on the shipping target, uploaded as a workflow artifact.
  # No tag, no GitHub Release, no signing: this is the "try the branch on a real
  # Windows 11 box" build. The tag-triggered release.yml remains the official path.
  bundle-windows:
    name: Windows installer (unsigned, artifact only)
    runs-on: windows-latest
    needs: rust-windows
    steps:
      - uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: bundle

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Without tagName/releaseId the action only builds. The unsigned overlay turns
          # off updater artifacts so the build does not need TAURI_SIGNING_PRIVATE_KEY.
          args: --config src-tauri/tauri.unsigned.conf.json
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v5
        with:
          name: tcb-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/tcb.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Drive the freshly built tcb.exe on real WebView2 over the DevTools protocol.
      # See tests/windows/e2e.test.mjs for what is and is not covered.
      - name: launch tcb.exe directly (it must stay running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "src-tauri\target\release\tcb.exe" -ArgumentList "$PWD\test.md" -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { Write-Error "tcb.exe exited after launch with code $($p.ExitCode)"; exit 1 }
          Write-Host "tcb.exe still running after 10s (pid $($p.Id)); main window: '$($p.MainWindowTitle)'"
          # Kill the whole tree: a surviving WebView2 browser process would be reused by the
          # next launch and ignore that launch's --remote-debugging-port.
          taskkill /PID $p.Id /T /F
          Start-Sleep -Seconds 2

      # A separate build whose only difference is a WebView2 DevTools port (see
      # src-tauri/tauri.e2e.conf.json); the shipped installer above never has one.
      - name: build the e2e variant of tcb.exe
        shell: bash
        working-directory: src-tauri
        run: |
          export TAURI_CONFIG="$(cat tauri.e2e.conf.json)"
          touch build.rs src/lib.rs
          cargo build --release --features tauri/custom-protocol
          cp target/release/tcb.exe "$RUNNER_TEMP/tcb-e2e.exe"

      - name: end-to-end checks on WebView2
        timeout-minutes: 15
        shell: bash
        env:
          TCB_EXE: ${{ runner.temp }}\tcb-e2e.exe
        run: node --test "tests/windows/*.test.mjs"

      # Install the shipped NSIS build silently, then open a .md file through the Windows
      # shell: the registered association must start the installed tcb.exe on that file.
      - name: installer and .md file association
        timeout-minutes: 5
        shell: pwsh
        run: |
          Get-Process tcb -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          Write-Host "installing $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter tcb.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\target\*" } | Select-Object -First 1
          if (-not $installed) { Write-Error "tcb.exe not found after install"; exit 1 }
          Write-Host "installed: $($installed.FullName)"
          $progId = (Get-ItemProperty -Path "HKCU:\Software\Classes\.md" -ErrorAction SilentlyContinue).'(default)'
          if (-not $progId) { $progId = (Get-ItemProperty -Path "HKLM:\Software\Classes\.md" -ErrorAction SilentlyContinue).'(default)' }
          Write-Host ".md progid: $progId"
          if (-not $progId) { Write-Error ".md has no registered handler"; exit 1 }
          $cmd = (Get-ItemProperty -Path "Registry::HKEY_CLASSES_ROOT\$progId\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          Write-Host "open command: $cmd"
          if ($cmd -notlike "*$($installed.Name)*") { Write-Error "open command does not start tcb.exe"; exit 1 }
          $doc = Join-Path $env:RUNNER_TEMP "assoc-check.md"
          Set-Content -Path $doc -Value "# Association check"
          Start-Process -FilePath $doc
          $proc = $null
          for ($i = 0; $i -lt 30 -and -not $proc; $i++) {
            Start-Sleep -Seconds 1
            $proc = Get-CimInstance Win32_Process -Filter "Name = 'tcb.exe'" | Where-Object { $_.CommandLine -like "*assoc-check.md*" }
          }
          if (-not $proc) { Write-Error "opening a .md file did not start tcb.exe with it"; exit 1 }
          Write-Host "shell open started: $($proc.CommandLine)"
          Stop-Process -Id $proc.ProcessId -Force

  ui-smoke:
    name: WebAssets smoke tests (headless Chromium)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright's browser installer
    # does not support yet ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No lockfile by design (the repo has no node build); install just Playwright.
      - name: install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@^1.63
          npx playwright install --with-deps chromium

      - name: node --test
        run: node --test "tests/ui/*.test.js"
